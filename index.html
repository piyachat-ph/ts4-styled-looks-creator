<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Styled Look Creator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand"><span class="brand-mark"></span><span id="app-name">Styled Look Creator</span></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-back" title="ย้อนกลับ" hidden></button>
      <button class="icon-btn" id="btn-help" title="วิธีใช้"></button>
    </div>
  </header>

  <main id="view"></main>

  <input type="file" id="tray-input" webkitdirectory directory multiple hidden>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/lib/binary.js"></script>
  <script src="js/lib/fnv.js"></script>
  <script src="js/lib/protobuf.js"></script>
  <script src="js/lib/dbpf.js"></script>
  <script src="js/lib/siminfo.js"></script>
  <script src="js/lib/styledlook.js"></script>
  <script src="js/lib/stbl.js"></script>
  <script src="js/lib/tray.js"></script>
  <script src="js/lib/build.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/icons-sims.js"></script>
  <script src="js/colorpicker.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
